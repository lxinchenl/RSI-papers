", "source": "", "review_scope": "本地摘要与既有依据", "semantic_change": false, "institutions": "National University of Singapore, Agency for Science, Technology and Research (ASTAR), SenseTime Group Inc.", "aliases": []}, {"id": "2610.22740", "title": "R$^2$Orch: Recursive Self-Improvement for Agent Orchestration via Self-Play within a Skill-Internalization Loop", "group": "核心", "number": 5, "level": "L2", "tags": ["Executor/Harness/Skill", "Executor/Model/Weights", "Improver/提出策略"], "reason": "编排器权重和 Skill 库更新，任务提议器的选题策略也被学习；Skill 撤除判据按固定贝叶斯规则执行。", "source": "", "review_scope": "本地摘要与既有依据", "semantic_change": false, "institutions": "Chinese University of Hong Kong, Shenzhen, Fudan University, University of Illinois Urbana-Champaign, Tsinghua University, National University of Singapore", "aliases": []}, {"id": "2610.22192", "title": "Terminal-RSI: Recursive Self-Improving Terminal Agents via Recursive Self-Rewrite and Policy-Refine", "group": "核心", "number": 6, "level": "L1", "tags": ["Executor/Model/Weights"], "reason": "RSR/RPR 多阶段更新终端智能体策略权重；奖励和训练流程未显示为自身进化。", "source": "", "review_scope": "本地摘要与既有依据", "semantic_change": false, "institutions": "Tencent Hy Frontier, National University of Singapore", "aliases": []}, {"id": "2610.21055", "title": "Athanor: An Agent-Native System for Autonomous Post-Training Research", "group": "核心", "number": 7, "level": "L2", "tags": ["Executor/Model/Weights", "Improver/提出策略"], "reason": "研究代理编写并修改训练算法，反复训练目标模型形成后继检查点；冻结评估服务不进化。", "source": "", "review_scope": "本地摘要与既有依据", "semantic_change": false, "institutions": "Bytedance, Duke University", "aliases": []}, {"id": "2610.20431", "title": "SwarmRSI: Recursive Self-Improvement through Evolving Scientific Agent Swarm", "group": "核心", "number": 8, "level": "L1", "tags": ["Executor/Harness/Memory"], "reason": "正文 §3 和附录 C.2 明确把假设、程序组件、实验结果与未解决需求保存在共享研究图中，并跨代导出到后续任务；新任务按机制标签检索这些记录，且在留出任务上测试继承收益，因此确认执行研究 Agent 的跨任务 Memory。不能把每个被优化的科研程序直接当作 Agent 自身代码；变异、重组、UCB 调度与评价规则固定，不标 Improver 或 Evaluato     TAGS.forEach((tag, index) => {
      const y = 65 + index * 43;
      let label = tag.replace('Executor/', '').replaceAll('/', ' · ');
      if (index === 5 || index === 7 || index === 9) content += `<line x1="13" y1="${y - 17}" x2="615" y2="${y - 17}" stroke="#d9e2ed"/>`;
      content += svgText(componentLeft - 13, y + 5, label, { anchor: 'end', size: 13 });
      const n = DATA.filter(row => row.tags.includes(tag)).length;
      const color = tag.startsWith('Evaluator/') ? '#cc944e' : tag.startsWith('Improver/') ? COLORS.extra : COLORS.core;
      const barWidth = n / componentMax * componentWidth;
      content += `<g data-category="${esc(tag)}" data-total="${n}">`;
      content += svgBar(componentLeft, y - 7, barWidth, 24, color, `${tag}：${n} 篇，占全库 ${pct(n)}`);
      content += svgText(componentLeft + barWidth + 7, y + 5, `${n} · ${pct(n)}`, { size: 12 });
      content += '</g>';
    });
    svgChart('component-chart', '11 个具体组件', '按功能角色对全库的 11 个组件作多标签统计。', 575, content);

    const combinations = [
      [['Executor'], '仅 Executor'], [['Evaluator'], '仅 Evaluator'], [['Improver'], '仅 Improver'],
      [['Executor','Evaluator'], 'Executor + Evaluator'], [['Executor','Improver'], 'Executor + Improver'],
      [['Evaluator','Improver'], 'Evaluator + Improver'], [MODULES, '三个模块共同更新'], [[], '无可确认组件'],
    ];
    const comboLeft = 215, comboWidth = 305, comboMax = 60;
    content = axis(comboLeft, 27, comboWidth, 477, comboMax, 10);
    combinations.forEach(([modules, label], index) => {
      const n = DATA.filter(row => {
        const actual = MODULES.filter(module => hasModule(row, module));
        return actual.length === modules.length && modules.every(module => actual.includes(module));
      }).length;
      const y = 46 + index * 54, barWidth = n / comboMax * comboWidth;
      const color = index === 0 ? COLORS.core : index === 6 ? COLORS.accent : index === 7 ? COLORS.other : COLORS.extra;
      content += svgText(comboLeft - 12, y + 15, label, { anchor: 'end', size: 13 });
      content += svgBar(comboLeft, y, barWidth, 30, color, `${label}：${n} 篇，占全部条目 ${pct(n)}`, `data-category="${esc(label)}" data-total="${n}"`);
      content += svgText(comboLeft + barWidth + 8, y + 15, `${n} · ${pct(n)}`, { size: 13 });
    });
    svgChart('combination-chart', '互斥模块组合', `每篇只进入一个模块组合，八个组合的计数合计为 ${DATA.length}。`, 510, content);

    const collections = [
      { label: '核心', count: coreRows.length, color: COLORS.core, definition: '题目或摘要提到 RSI 的论文' },
      { label: '拓展', count: extraRows.length, color: COLORS.extra, definition: '由我们人为判断与 RSI 相关的论文' },
    ];
    const total = collections.reduce((sum, item) => sum + item.count, 0);
    const cx = 320, cy = 163, radius = 135;
    let angle = -Math.PI / 2;
    content = '';
    collections.forEach(item => {
      const delta = item.count / total * 2 * Math.PI;
      const end = angle + delta;
      const x1 = cx + radius * Math.cos(angle), y1 = cy + radius * Math.sin(angle);
      const x2 = cx + radius * Math.cos(end), y2 = cy + radius * Math.sin(end);
      const description = `${item.label}：${item.count} 篇，占 ${pct(item.count, total)}；${item.definition}`;
      content += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${delta > Math.PI ? 1 : 0} 1 ${x2} ${y2} Z" fill="${item.color}" stroke="#f8fafd" stroke-width="3" data-category="${item.label}" data-total="${item.count}"><title>${esc(description)}</title></path>`;
      const middle = angle + delta / 2;
      const lx = cx + 76 * Math.cos(middle), ly = cy + 76 * Math.sin(middle);
      content += svgText(lx, ly - 22, item.label, { anchor: 'middle', fill: 'white', size: 19, weight: 600 });
      content += svgText(lx, ly + 4, `${item.count} 篇`, { anchor: 'middle', fill: 'white', size: 24, weight: 600 });
      content += svgText(lx, ly + 30, pct(item.count, total), { anchor: 'middle', fill: 'white', size: 17 });
      angle = end;
    });
    svgChart('collection-chart', '核心与拓展数量', collections.map(item => `${item.label} ${item.count} 篇：${item.definition}`).join('；'), 320, content);
    el('collection-legend').innerHTML = collections.map(item => `<div class="collection-item"><span class="collection-dot" style="background:${item.color}"></span><div><div class="collection-label">${item.label}<span class="collection-value">${item.count} 篇 · ${pct(item.count, total)}</span></div><p class="collection-definition">${item.definition}</p></div></div>`).join('');
  }

  function buildComponentOptions() {
    el('component-options').innerHTML = MODULES.map(module => `<fieldset><legend>${module}</legend>${TAGS.filter(tag => tag.startsWith(module + '/')).map(tag => {
      const count = DATA.filter(row => row.tags.includes(tag)).length;
      return `<label class="check-label"><input type="checkbox" name="component" value="${esc(tag)}" aria-label="${esc(tag)}"><span class="tag-name">${esc(tag.substring(module.length + 1).replaceAll('/', ' / '))}</span><span class="tag-count">${count}</span></label>`;
    }).join('')}</fieldset>`).join('');
    el('component-options').addEventListener('change', event => {
      const input = event.target;
      if (!input.matches('input[name="component"]')) return;
      if (input.checked) selectedTags.add(input.value); else selectedTags.delete(input.value);
      render();
    });
  }

  function selectedConditions() {
    return [...MODULES.filter(module => selectedModules.has(module)), ...TAGS.filter(tag => selectedTags.has(tag))];
  }

  function syncFilterControls() {
    document.querySelectorAll('.module-toggle').forEach(button => button.setAttribute('aria-pressed', String(selectedModules.has(button.dataset.module))));
    document.querySelectorAll('input[name="component"]').forEach(input => { input.checked = selectedTags.has(input.value); });
    el('component-count').textContent = selectedTags.size ? `已选 ${selectedTags.size} 项` : '不限';
    const chosen = selectedConditions();
    const conjunction = el('tag-mode').value === 'all' ? '全部满足' : '任一满足';
    el('active-filters').innerHTML = chosen.length ? `<span>${conjunction}：</span>` + chosen.map(condition => `<span class="active-filter">${esc(condition)}<button type="button" data-remove="${esc(condition)}" aria-label="取消 ${esc(condition)}">×</button></span>`).join('') : '';
  }

  function render() {
    syncFilterControls();
    const query = el('q').value.toLowerCase().trim();
    const aliasMatches = new Set(DATA.filter(row => (row.aliases || []).some(alias => alias.toLowerCase() === query)).map(row => row.id));
    const group = el('group').value, level = el('level').value, change = el('change').value;
    const chosen = selectedConditions(), matchAll = el('tag-mode').value === 'all';
    const rows = DATA.filter(row => {
      const matches = condition => MODULES.includes(condition) ? hasModule(row, condition) : row.tags.includes(condition);
      const tagMatch = !chosen.length || (matchAll ? chosen.every(matches) : chosen.some(matches));
      const levelMatch = !level || (level === 'methods' ? ['L1','L2'].includes(row.level) : level === 'other' ? !['L1','L2'].includes(row.level) : row.level === level);
      const changeMatch = !change || (change === 'yes' ? row.semantic_change : change === 'body' ? !!row.source : row.tags.length === 0);
      const searchMatch = !query || (aliasMatches.size ? aliasMatches.has(row.id) : [row.title, ...(row.aliases || []), row.institutions, row.id, row.reason, ...row.tags].join(' ').toLowerCase().includes(query));
      return (!group || row.group === group) && tagMatch && levelMatch && changeMatch && searchMatch;
    });
    el('count').textContent = `当前筛选 ${rows.length} / ${DATA.length} 篇`;
    el('bars').innerHTML = MODULES.map(module => {
      const n = rows.filter(row => hasModule(row, module)).length;
      return `<div class="bar"><span>${module}</span><div class="track"><div class="fill" style="width:${rows.length ? n / rows.length * 100 : 0}%"></div></div><span class="bar-count">${n} / ${rows.length}</span></div>`;
    }).join('');
    el('rows').innerHTML = rows.map(row => `<tr data-id="${esc(row.id)}"><td>${row.group}<br>${row.number}</td><td class="title"><a href="${esc(row.source || 'https://arxiv.org/abs/' + row.id)}" target="_blank" rel="noopener">${esc(row.title)}</a>${row.aliases?.length ? `<div class="paper-alias">方法名：${esc(row.aliases[0])}</div>` : ''}<span class="paper-id">${row.id}</span><div class="paper-institutions"><strong>机构：</strong>${esc(row.institutions)}</div></td><td>${esc(row.level)}</td><td>${row.tags.length ? row.tags.map(tag => `<span class="chip ${tag.split('/')[0]}">${esc(tag)}</span>`).join('') : '无可确认组件'}</td><td class="reason">${esc(row.reason)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">没有匹配条目。可移除部分标签，或切换为“任一满足（并集）”。</td></tr>';
  }

  document.querySelectorAll('.module-toggle').forEach(button => button.addEventListener('click', () => {
    const module = button.dataset.module;
    if (selectedModules.has(module)) selectedModules.delete(module); else selectedModules.add(module);
    render();
  }));
  el('active-filters').addEventListener('click', event => {
    const button = event.target.closest('button[data-remove]');
    if (!button) return;
    selectedModules.delete(button.dataset.remove);
    selectedTags.delete(button.dataset.remove);
    render();
  });
  ['q','group','level','change','tag-mode'].forEach(id => el(id).addEventListener(id === 'q' ? 'input' : 'change', render));
  el('reset').addEventListener('click', () => {
    ['q','group','level','change'].forEach(id => { el(id).value = ''; });
    el('tag-mode').value = 'all';
    selectedModules.clear();
    selectedTags.clear();
    render();
  });
  document.querySelectorAll('.download').forEach(button => button.addEventListener('click', () => {
    const svg = el(button.dataset.chart).querySelector('svg');
    const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + svg.outerHTML], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url;
    link.download = 'RSI-' + button.dataset.chart + '.svg';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }));
  buildComponentOptions();
  drawCharts();
  render();
</script>
</body>
</html>
